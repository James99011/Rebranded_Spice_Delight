  <section class="videos-header">
    <h1>Our Videos 🎬</h1>
    <p>Watch our recipes and tutorials in action!</p>
  </section>

  <!-- Filter Buttons -->
  <div class="video-filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="recipes">Recipes</button>
    <button class="filter-btn" data-filter="tutorials">Tutorials</button>
    <button class="filter-btn" data-filter="drinks">Drinks</button>
  </div>

  <!-- Video Gallery -->
  <section class="video-gallery">
    <!-- Video 1 -->
    <div class="video-item" data-category="recipes" data-video="https://www.youtube.com/embed/Fvj0OCdV0QA?si=lS6QjUj7P20u75a3">
      <img src="image/youtube_thumbnail3.jpg" alt="Video 1">
      <div class="play-button">▶</div>
      <p class="video-title">Italian Dish</p>
    </div>

    <!-- Video 2 -->
    <div class="video-item" data-category="recipes" data-video="https://www.youtube.com/embed/TEtEUdqLlck?si=IH2yUiw-wrscbI5M">

    <div class="video-item" data-category="drinks" data-video="https://www.youtube.com/embed/GplN-6TqXoc?si=F9h3jZvaYttmvo7x">

      <p class="video-title">Coffee Perfection</p>

    <!-- Video 4 -->
    <div class="video-item" data-category="tutorials" data-video="https://www.youtube.com/embed/MOvq3QFKStE?si=WMbBleXs9JFQCCaV">

      <div class="play-button">▶</div>
      <p class="video-title">Easy Sandwich Tutorial</p>
    </div>
  </section>

  <!-- Video Modal -->
  <div id="videoModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <iframe id="videoFrame" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>
